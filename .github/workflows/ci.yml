name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Lint
        run: bunx oxlint
      - name: Type-check
        run: bunx tsc --noEmit -p app/tsconfig.json
      - name: Unused code (knip)
        run: bunx knip
      - name: Unit tests
        run: bunx vitest run
